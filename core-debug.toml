schema_version = 1

[core]
name = "Bucky"
platform = "MiSTer/JTFRAME"
top = "cores/bucky/hdl/jtbucky_game.v"
status_file = "NOTES.md"

[reference]
emulator = "MAME"
version = "0.289"
source_root = "D:/Arcade/AI/mame289"
executable = "D:/arcade/ai/mameexe/mame.exe"
executable_sha256 = "AF6966108D9B52C22465C6D50F4E5D50CC371B50F2D27DC443935F287AAD37A3"
source_revision = "MAME 0.289 source snapshot (D:/Arcade/AI/mame289; no .git metadata)"
driver_files = ["src/mame/konami/moo.cpp"]
known_imperfect = ["graphics", "shadow-priority", "sprite-zoom-rounding", "zero-z-sprites"]

[commands]
validate_source = "powershell -NoProfile -File cores/bucky/tools/validate_source.ps1"
validate_rtl_contracts = "python cores/bucky/tools/validate_rtl_contracts.py"
validate_mra = "python cores/bucky/tools/validate_mra.py --parent-only \"cores/bucky/releases/Bucky O'Hare.mra\""
test_focused = "powershell -NoProfile -ExecutionPolicy Bypass -File cores/bucky/tools/run_component_tests.ps1"
pre_hardware = "powershell -NoProfile -ExecutionPolicy Bypass -File cores/bucky/tools/pre_hardware_audit.ps1"
build_sim = "verilator-safe --savable"

[artifacts]
private = ["rom/", ".workbench/", "artifacts/", "checkpoints/"]
generated = ["obj_dir/", "cores/bucky/mister/"]
preserve_between_runs = ["obj_dir/", "checkpoints/"]

[trace]
schema = "mister-bus-jsonl-v1"
compare_fields = ["cpu", "event", "rw", "address", "data", "lanes", "device"]
checkpoint_events = ["post-reset", "post-ramtest", "attract-entry", "post-coinstart", "gameplay-entry"]
scenario_file = "cores/bucky/cfg/regressions.toml"

[video]
width = 384
height = 224
rotation = "none"
capture_format = "P6"

[[sets]]
name = "bucky"
role = "parent-first-bringup"
features = ["k054000", "k053990", "k054338", "four-player", "k054539"]

[[sets]]
name = "buckyea"
role = "clone-regression"

