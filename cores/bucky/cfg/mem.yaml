params:
  - { name: RAM_OFFSET,   value: "22'h140000" }
  - { name: PCM_OFFSET,   value: "22'h040000>>1" }   # pcm va TRAS el snd ROM de 256KB (0x40000 bytes),
                                                     # no 128KB: con 0x020000 el k054539 leia CODIGO del
                                                     # Z80 como audio -> "otro sonido" en placa (FM OK, el
                                                     # tb/harness no lo veian por usar el .bin sin SDRAM).
clocks:
  clk48:
    - freq: 16M
      outputs:
        - cen_16
        - cen_8
        - cen_4   # cen_fm
        - cen_2   # cen_fm2
    - freq: 18432k
      gate: [pcm]
      outputs:
        - cen_pcm
audio:
  # CANALES SEPARADOS (fidelidad): antes un solo canal `k539` con FM+PCM ya sumados DENTRO del
  # k054539 -> el clip16 railaba (sesion 21: "todo saturado"). Ahora FM y PCM van por canales
  # PROPIOS y el rcmix de jtframe mezcla en precision ancha -> sin comprometer headroom.
  # module: solo aporta metadata (stereo/data_width/vpp); el RTL lo instancia cowboys_sound.v a mano.
  # `jt054539` (no `k054539`) porque el modulo de audio del comun define ese: stereo/dw16/vpp 1.0.
  gain: 1.99
  rsum: 1k
  rsum_feedback_res: true       # gain = rsum/rsum_canal (transparente); rsum iguales -> mismo peso base,
  channels:                     # y el vpp de cada modulo (jt51 0.5, jt054539 1.0) da el balance fisico.
    - { name: fm,   module: jt51,     rsum: 1k, rc: [ { r: 4.7k, c: 2.2n } ] }
    - { name: pcm,  module: jt054539, rsum: 1k, rc: [ { r: 4.7k, c: 2.2n } ] }
sdram:
  banks:
    - buses:
        - name: ram
          addr_width: 18      # Bucky work/extra RAM + 0x184000 tile RAM bank: 3 banks of 64KB = 192KB = 96K words -> AW 18 (puerto [17:1]).
          data_width: 16       # Antes 14 (16KB): el stack/vars colisionaban por aliasing. moo.cpp:575.
          offset: RAM_OFFSET
          rw: true
        - name: main
          addr_width: 22      # region maincpu de BUCKY = 0x240000 BYTES (moo.cpp:1014), no 0x180000
          data_width: 16       # (ese es el tamaño de moomesa): prog 0x000000-0x07ffff + HUECO + datos
          cache_size: 8        # cache only requested words; the 2-line burst cache can alias an adjacent
                               # 64-bit burst word onto a live tag during fx68k back-to-back DBRA fetches.
                               # 0x200000-0x23ffff, direccionada PLANA (verificado: en el .rom el soundcpu
                               # empieza justo en 0x240000). El mismo bug que dejaba esto documentado para
                               # moomesa (AW insuficiente -> bit alto perdido -> datos alias sobre programa
                               # -> "N4 DEVICE ERROR" / cuelgue) aplica aqui con la region MAS GRANDE de
                               # Bucky: AW 22 -> [21:1] = 2M words; ram empieza en RAM_OFFSET=0x140000
                               # words (=0x280000 bytes) -> no solapa con los 0x240000 bytes de maincpu.
    - buses:
        - name: snd
          # Z80 program ROM: 16 banks x 0x4000 bytes, selected by the
          # 0xf800 latch. The complete parent region is 0x40000 bytes.
          addr_width: 18
          data_width: 8
        - name: pcm
          addr_width: 22
          data_width: 8
          offset: PCM_OFFSET
    # K056832 (Moo Mesa): 1 bus de tile SERIAL (fix + 3 scroll multiplexadas por la FSM del modulo),
    # region k056832 = 0x200000 bytes = 0x80000 words DW32 -> addr_width 19. Estilo rungun (bus scr unico),
    # NO 3 buses paralelos estilo xmen. Ver HANDOFF 5b / research/K056832-RTL-DESIGN.
    - buses:
        - name: scr
          addr_width: 21      # region k056832 = 0x200000 bytes = 2MB; port [20:2]
          data_width: 32
    - buses:
        - name: lyro
          addr_width: 23      # 8MB ROM sprites (2M words DW32 = 21b word addr -> puerto [22:2]). Antes 22 (->[21:2]) truncaba el MSB.
          data_width: 32
bram:
  # EEROM
  - name: nvram
    addr_width: 7
    data_width: 8
    simfile: {}

    rw: true
    ioctl: { save: true, restore: true, order: 0 }
